name: Validate cloud-mail
on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
        working-directory: mail-worker
      - run: pnpm exec wrangler deploy --dry-run --outdir /tmp/cloud-mail-validation
        working-directory: mail-worker
